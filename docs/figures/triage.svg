<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="588" viewBox="0 0 1120 588" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">From a failing call to its runbook row</title>
<desc id="desc">A column of five checks from a call that fails or waits, each leading to the runbook rows it names: the gateway down (FlatshareGatewayDown); /ready not 200, the engine not ready, degraded or warming (FlatshareEngineNotReady, FlatshareEngineDegraded, FlatshareEngineWarming); a node unhealthy or covering (FlatshareNodeUnhealthy, FlatshareNodeCovering); refusals for a full bound or no slot (FlatshareRequestsRefusedForCapacity, FlatshareCallsRefused, 503 no_agent_slot); a full KV pool with requests waiting (FlatshareKvPoolFullWithWaiting); and, when all five pass, the voice plane: the worker's journal and LiveKit's.</desc>
