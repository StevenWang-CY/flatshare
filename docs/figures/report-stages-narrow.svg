<svg xmlns="http://www.w3.org/2000/svg" width="420" height="466" viewBox="0 0 420 466" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">Where the voice turn's seconds go</title>
<desc id="desc">The voice turn's mean voice-to-voice time stacked by stage from the end of the caller's speech: voice alone, 1.62 s, 0.09 s of it waiting for the LLM's first token and 0.22 s decoding the first sentence; tuned vLLM beside 24 agent sessions, 5.30 s, 2.81 s of it waiting for the LLM's first token and 1.07 s decoding the first sentence; with make-room, 3.41 s, 0.78 s of it waiting for the LLM's first token and 1.21 s decoding the first sentence; with make-room and the prefill hold at 48 tokens, 1.97 s, 0.29 s of it waiting for the LLM's first token and 0.26 s decoding the first sentence.</desc>
