<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="259.28" viewBox="0 0 1120 259.28" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">A release and its exits</title>
<desc id="desc">The release's states in order, prepare, verify, drain, switch, restart, check and serving: a host that is locked or an upload that changed exits 2, a failed verification exits 1, and a drain whose calls do not end or that meets a running E2 point exits 2, each with nothing switched; any failure from the switch through the check switches back, which exits 1 with the previous release running again or 3 when switching back fails too; a release that passes its checks serves and exits 0, and a rollback enters at the verification with the previous release.</desc>
