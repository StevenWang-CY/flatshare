<svg xmlns="http://www.w3.org/2000/svg" width="420" height="888" viewBox="0 0 420 888" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">Two cards: placement and failover</title>
<desc id="desc">Two panels of the two cards' slots as the gateway bounds them, two call slots each and up to 4 agents' sessions on Phastform and 12 on Gray: in panel a, in service, both calls fill Phastform and Gray, the warm spare, runs agents only; in panel b, Phastform's engine failed, both calls take Gray's call slots at their next turn, 0.7 s after a kill and 1.9 s after a stop in the drills, and Gray holds its agents' requests until the moved calls end.</desc>
