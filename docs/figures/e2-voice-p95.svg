<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="494" viewBox="0 0 1120 494" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">Two voice calls beside 24 coding-agent sessions on one RTX 5060 Ti</title>
<desc id="desc">voice-to-voice p95 against an SLO of 2.03 s and the agents' tokens/s: Tuned vLLM 0.32, the baseline, 10.48 s and 3,305 tokens/s (100% of the first row's) over 10 runs; A router, aborts and resubmits, 2.52 s and 3,332 tokens/s (101% of the first row's) over 5 runs; #63350, KV preemption, 5.09 s and 3,414 tokens/s (103% of the first row's) over 5 runs; #63350 and #63351, 16-token window, 3.09 s and 3,298 tokens/s (100% of the first row's) over 5 runs; #63350 and #63351, 48-token window, 2.24 s and 3,203 tokens/s (97% of the first row's) over 15 runs.</desc>
