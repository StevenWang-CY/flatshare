<svg xmlns="http://www.w3.org/2000/svg" width="420" height="826" viewBox="0 0 420 826" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">A release and its exits</title>
<desc id="desc">A column of the release's states, prepare, verify, drain, switch, restart, check and serving: a host that is locked or an upload that changed exits 2, a failed verification exits 1 and a drain whose calls do not end exits 2, each with nothing switched; any failure from the switch through the check switches back, which exits 1 with the release before running again or 3 when switching back fails too; a release that passes its checks serves and exits 0, and a rollback enters at the verification with the previous release.</desc>
