<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1556" viewBox="0 0 420 1556" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">The system at a glance</title>
<desc id="desc">Three panels around one engine change: in the serving plane, callers reach the voice worker and coding agents reach the gateway, which sends both to vLLM 0.32 with #63350 and #63351, the KV preemption and the budget cap, over the GPU's KV pool and the CPU tier beside the speech servers; beside it the measurement plane, with the scripted callers, AIPerf's replay of Claude Code traces, the E2 harness, probes and counters, gates, and the cost model and simulator; and the operations plane, with the serving profile and its serving-check, immutable releases, two cards with a warm spare, drain and failover, failure drills and a 24-hour soak, and the container.</desc>
