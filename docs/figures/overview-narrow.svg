<svg xmlns="http://www.w3.org/2000/svg" width="420" height="424" viewBox="0 0 420 424" font-size="21" role="img" aria-labelledby="title desc">
<title id="title">The serving path at a glance</title>
<desc id="desc">The serving path, each flow an arrow: callers reach the voice worker, and the voice worker and the coding agents reach the gateway, which sends the voice turns at priority 0 and the agents' requests at priority 2 to vLLM 0.32 with #63350 and #63351, the KV preemption and the budget cap, over the GPU's KV pool and the CPU tier; under each part's name is its directory in the repository.</desc>
