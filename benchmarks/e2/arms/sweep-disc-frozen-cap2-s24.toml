# The step-cap and window sweep (sweep-screen.campaign, then sweep-r1.campaign to sweep-r5.campaign on fresh samples of
# the agents): the frozen box behind the gateway's static cap of 2 background requests in flight, as
# disc-a6-cap8-s24.toml is with 8, each call opening with an unmeasured warm-up turn.
arm = "6-cap2"
label = "frozen box + static cap, 2 background in flight, discriminating scenario, a warm-up turn opening each call"

[voice]
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[gateway.admission]
policy = "static-cap"
background_max_in_flight = 2
queue_timeout_s = 240
