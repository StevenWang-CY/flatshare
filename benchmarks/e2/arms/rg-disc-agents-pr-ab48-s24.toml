# The resource gate (benchmarks/quality/RESOURCE-GATE.md): a dedicated card's agents, controlled. No call, on the
# shared card's engine as W5 measured it (vLLM PRs A and B with a 48-token window, no reserve: w5-disc-pr-ab48-s24.toml),
# the speech servers resident and idle, their memory left unused; the discriminating scenario's 24 long sessions, over
# the default window.
arm = "9-pr-ab48-agents-only"
label = "the agents alone on the shared card's engine, vLLM PRs A and B with a 48-token window, the speech servers idle"

[voice]
callers = 0

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = ["--additional-config.make_room.reserve_tokens", "0", "--additional-config.make_room.budget_cap_tokens", "48"]
