# E2 arm 9 in the discriminating scenario (24 session trees on weka-x32-long, as disc-frozen-s24.toml).
# Arm 9 with the headroom armed in the critical window only (from the end of turn or the realtime request), not
# from speech onset.
arm = 9
label = "Arm 9, headroom armed by the realtime request"

[agents]
sessions = 24
data = "weka-x32-long"

[gateway.admission]
policy = "lifecycle"
headroom_tokens = 1024
critical_prefill_budget_ms = 150
degrade_max_tokens = 16
trigger = "request"

[engine]
variant = "make-room"
