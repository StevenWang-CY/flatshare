# The step-cap and window sweep (sweep-screen.campaign, then sweep-r1.campaign to sweep-r5.campaign on fresh samples of
# the agents): tuned vLLM at a step cap of 1,024 with no long-prefill threshold, as disc-a4-b1024-t0-s24.toml, each call
# opening with an unmeasured warm-up turn, as W5 measured the frozen box.
arm = "4-b1024-t0"
label = "priority, step cap 1024, long-prefill threshold 0, discriminating scenario, a warm-up turn opening each call"

[voice]
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
flags = ["--max-num-batched-tokens", "1024", "--long-prefill-token-threshold", "0"]
