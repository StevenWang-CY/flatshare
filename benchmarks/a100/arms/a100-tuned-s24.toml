# The A100 run's optional arm 6, tuned vLLM (docs/HARDWARE.md, the optional arms): the frozen engine at the step cap
# whose calls' first-token p95 was the lowest in blocks 1 and 2 on this card (probe_results.py pick-stock), vLLM's
# default chunking, 2,048/0, arm 3's engine. The core keeps the box's 512/256, the box's best, so that a difference
# within the A100 is the change's; this arm is the stock engine at the A100's own best. Otherwise
# w5-disc-frozen-s24.toml, as the core runs it.
arm = 3
label = "priority, default chunking (the A100's best stock step cap), discriminating scenario, a warm-up turn opening each call"

[voice]
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
flags = ["--max-num-batched-tokens", "2048", "--long-prefill-token-threshold", "0"]
