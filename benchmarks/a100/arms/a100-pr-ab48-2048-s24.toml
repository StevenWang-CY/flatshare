# The A100 run's optional arm 8, the PRs' values at the A100's best stock step cap (docs/BENCHMARKS.md, the optional
# arms): the PRs' 48-token configuration on vLLM's default chunking, 2,048/0, tuned vLLM's step cap (arm 6), so that it
# pairs with tuned vLLM on the same samples of the agents, as the core pairs the PRs' values with the box's 512/256.
# Otherwise w5-disc-pr-ab48-s24.toml.
arm = "9-pr-ab48"
label = "vLLM PRs A and B with a 48-token window at default chunking (the A100's best stock step cap), no gateway policy, a warm-up turn opening each call"

[voice]
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = [
  "--max-num-batched-tokens", "2048", "--long-prefill-token-threshold", "0",
  "--additional-config.make_room.reserve_tokens", "0", "--additional-config.make_room.budget_cap_tokens", "48",
]
