<text x="584" y="92" text-anchor="middle">Voice-to-voice p95</text>
<text x="584" y="117" text-anchor="middle" class="soft" font-size="18">seconds, median of the runs • Lower is better</text>
<text x="930" y="92" text-anchor="middle">Agents' goodput</text>
<text x="930" y="117" text-anchor="middle" class="soft" font-size="18">tokens/s over the calls • Higher is better</text>
<text x="24" y="191" class="mute" font-size="18">Stock vLLM, arms 1–5</text>
<text x="388" y="217" text-anchor="end" font-size="20">Frozen box, one caller beside 12</text>
<text x="388" y="239" text-anchor="end" font-size="20">session trees on weka-x32-long</text>
<text x="24" y="273" class="mute" font-size="18">Make-room, arm 9</text>
<text x="388" y="299" text-anchor="end" font-size="20">vLLM #63350 and #63351, 48-token</text>
<text x="388" y="321" text-anchor="end" font-size="20">window, step cap 256, one caller</text>
<text x="388" y="343" text-anchor="end" font-size="20">beside 12 session trees, warm-up turn</text>
