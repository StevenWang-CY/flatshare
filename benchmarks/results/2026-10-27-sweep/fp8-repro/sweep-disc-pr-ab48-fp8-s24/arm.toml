# The step-cap and window sweep's second screen (sweep-screen2.campaign), on W5's first sample of the agents:
# the change as the PRs propose it (make-room, no reserve, a 48-token window) with the KV cache in FP8,
# which doubles the pool's tokens in the same 5 GiB and moves attention to FlashInfer (FlashAttention 2 has no FP8 KV on
# this card).
arm = "9-pr-ab48-fp8"
label = "vLLM PRs A and B, 48-token window, FP8 KV cache, discriminating scenario, warm-up turn"

[voice]
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = [
  "--additional-config.make_room.reserve_tokens", "0",
  "--additional-config.make_room.budget_cap_tokens", "48",
  "--kv-cache-dtype", "fp8",
]
