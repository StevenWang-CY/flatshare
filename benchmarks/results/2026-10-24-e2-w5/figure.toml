# The README's figure, docs/figures/e2-voice-p95.svg and its phone layout e2-voice-p95-narrow.svg (make e2-w5-figure):
# these points' configurations in the discriminating scenario, top to bottom, the first the baseline the agents'
# throughput is a share of. Each ran in the same rounds as the others, over W5's five samples of the agents' traces.
# `change` marks the rows that run the two PRs' rules (the make-room variant on vLLM 0.32.0 with the PRs' switch
# values, on the tuned box) and `featured` the configuration to deploy; `note` is the second line under a row's label.
# A figure of several GPUs, the A100's beside the box's, gives each its rows under a [[group]] table with a `title`
# (benchmarks/e2/README.md, Results).

[[row]]
point = "w5-disc-frozen-s24"
label = "Tuned vLLM 0.32"
note = "the baseline"

[[row]]
point = "w5-disc-a8c-resubmit-s24"
label = "A router"
note = "aborts and resubmits"

[[row]]
point = "w5-disc-pr-a-s24"
label = "#63350"
note = "KV preemption"
change = true

[[row]]
point = "w5-disc-pr-ab-s24"
label = "#63350 and #63351"
note = "16-token window"
change = true

[[row]]
