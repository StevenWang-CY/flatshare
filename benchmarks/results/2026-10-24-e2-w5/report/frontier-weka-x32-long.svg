<text x="560" y="38" text-anchor="middle" font-size="23">Voice tail and the agents' goodput: weka-x32-long, 2 callers</text>
<text x="584" y="92" text-anchor="middle">Voice-to-voice p95</text>
<text x="584" y="117" text-anchor="middle" class="soft" font-size="18">seconds, median of the runs • Lower is better</text>
<text x="930" y="92" text-anchor="middle">Agents' goodput</text>
<text x="930" y="117" text-anchor="middle" class="soft" font-size="18">tokens/s over the calls • Higher is better</text>
<text x="24" y="191" class="mute" font-size="18">Stock vLLM, arms 1–5</text>
<text x="321.37" y="217" text-anchor="end" font-size="20">Frozen box</text>
<text x="388" y="217" text-anchor="end" class="soft" font-size="18">10 runs</text>
<text x="24" y="251" class="mute" font-size="18">Routers, arm 8</text>
<text x="388" y="277" text-anchor="end" font-size="20">Frozen box + preempt-resubmit</text>
<text x="330.28" y="299" text-anchor="end" font-size="20">before the first byte</text>
<text x="388" y="299" text-anchor="end" class="soft" font-size="18">5 runs</text>
<text x="24" y="333" class="mute" font-size="18">Make-room, arm 9</text>
<text x="388" y="359" text-anchor="end" font-size="20">vLLM #63350: make-room's KV</text>
<text x="388" y="381" text-anchor="end" font-size="20">preemption alone, no gateway policy</text>
<text x="388" y="403" text-anchor="end" class="soft" font-size="18">5 runs</text>
<text x="388" y="433" text-anchor="end" font-size="20">vLLM #63350 and #63351: KV preemption</text>
<text x="388" y="455" text-anchor="end" font-size="20">and the budget cap, no gateway policy</text>
<text x="388" y="477" text-anchor="end" class="soft" font-size="18">5 runs</text>
<text x="388" y="507" text-anchor="end" font-size="20">vLLM #63350 and #63351 with a</text>
<text x="388" y="529" text-anchor="end" font-size="20">48-token window, no gateway policy</text>
<text x="388" y="551" text-anchor="end" class="soft" font-size="18">15 runs</text>
<text x="388" y="581" text-anchor="end" font-size="20">vLLM #63350 and #63351 with</text>
<text x="388" y="603" text-anchor="end" font-size="20">a 48-token window as v0.3</text>
