# The optimization rounds (opt-rN.campaign): the configuration to deploy at the serving profile's step cap
# (256, threshold 0), with 4 callers; its pair with the calls' prefixes kept on the GPU is opt-disc-ret-c4-s24.
arm = "9-pr-ab48-b256-t0-calls"
label = "the configuration to deploy, step cap 256, 4 callers, discriminating scenario, warm-up turn"

[voice]
callers = 4
warmup_turns = 1

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = ["--additional-config.make_room.reserve_tokens", "0", "--additional-config.make_room.budget_cap_tokens", "48", "--max-num-batched-tokens", "256", "--long-prefill-token-threshold", "0"]
