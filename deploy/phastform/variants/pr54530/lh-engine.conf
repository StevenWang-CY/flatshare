# Variant pr54530 (E2 arm 7a): vLLM PR #54530 on the frozen box. Under priority scheduling a waiting request may
# preempt the lowest-priority running one once the running queue is full. At every start, python/leaseholder_vllm's
# build.py applies the PR's port to the installed vLLM's scheduler (into cache/pr54530) and the engine loads the module
# with --scheduler-cls. The PR acts only when the running queue is full by count, never under KV pressure, so the
# variant lowers --max-num-seqs to 12 (vLLM's default here is 256). probe.py (beside the patch) is its check.
[Service]
ExecStartPre=%h/leaseholder/venvs/engine/bin/python %h/leaseholder/src/python/leaseholder_vllm/src/leaseholder_vllm/build.py pr54530 %h/leaseholder/cache/pr54530
Environment=PYTHONPATH=%h/leaseholder/cache/pr54530
ExecStart=
ExecStart=%h/leaseholder/venvs/engine/bin/vllm serve --config %h/leaseholder/src/deploy/phastform/engine.yaml --scheduler-cls lh_pr54530_scheduler.AsyncScheduler --max-num-seqs 12 --uds ${LH_ENGINE_SOCKET} $LH_ENGINE_FLAGS
