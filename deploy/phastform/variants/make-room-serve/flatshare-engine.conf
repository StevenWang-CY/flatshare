# Variant make-room-serve: the box's serving configuration, rendered from deploy/profiles/rtx-5060-ti-serve.toml. The
# make-room variant (variants/make-room) as the report recommends deploying it, #63350 and #63351 as W5 measured them,
# at the step cap the sweep chose (benchmarks/results/2026-10-27-sweep): KV make-room at
# 2 preemptions a step, the budget cap with a 48-token
# window and a reserve of 0 tokens, set here rather than as engine flags over arm 9's values,
# which variants/make-room keeps for E2, and the step cap, --max-num-batched-tokens 256
# --long-prefill-token-threshold 0, on the command line over engine.yaml's,
# which stays the frozen box's.
#
# The scheduler is make-room's module, which build.py writes from the same patches at every start, under
# python/flatshare_vllm's serve module: its AsyncScheduler is make-room's, unchanged, and writes the configuration the
# engine runs with to $FLATSHARE_ENGINE_EFFECTIVE as the engine starts. The start then holds that to serving.json,
# the profile's effective configuration in this node's directory (deploy/bin/serving-check, which prints both): an
# engine that runs anything else, a flag over these or another module, fails its start, and the journal names each
# setting that differs. variants/README.md says how a box installs it.
#
# vLLM's development mode stays off, so that a serving box serves none of its development routes even where a
# campaign left the measurement drop-in linked: measure.conf sorts before this file, and systemd keeps the last
# assignment.
[Service]
ExecStartPre=%h/flatshare/venvs/engine/bin/python %h/flatshare/src/python/flatshare_vllm/src/flatshare_vllm/build.py make-room %h/flatshare/cache/make-room
Environment=PYTHONPATH=%h/flatshare/cache/make-room:%h/flatshare/src/python/flatshare_vllm/src/flatshare_vllm/serve
Environment=FLATSHARE_ENGINE_EFFECTIVE=%t/flatshare/engine-effective.json
Environment=VLLM_SERVER_DEV_MODE=0
ExecStartPre=/usr/bin/rm -f ${FLATSHARE_ENGINE_EFFECTIVE}
ExecStart=
ExecStart=%h/flatshare/src/deploy/bin/in-private-net %h/flatshare/venvs/engine/bin/vllm serve --config %h/flatshare/src/deploy/phastform/engine.yaml --max-num-batched-tokens 256 --long-prefill-token-threshold 0 --scheduler-cls flatshare_make_room_serve.AsyncScheduler --additional-config.make_room.max_preemptions_per_step 2 --additional-config.make_room.budget_cap true --additional-config.make_room.budget_cap_tokens 48 --additional-config.make_room.reserve_tokens 0 --uds ${FLATSHARE_ENGINE_SOCKET} $FLATSHARE_ENGINE_FLAGS
ExecStartPost=/usr/bin/python3 %h/flatshare/src/deploy/bin/serving-check %h/flatshare/src/deploy/phastform/serving.json --engine ${FLATSHARE_ENGINE_EFFECTIVE} --pid ${MAINPID}
