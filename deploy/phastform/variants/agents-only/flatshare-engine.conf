# Variant agents-only: the card serves the agents alone, a dedicated background card (the resource gate's best
# practical dedicated arrangement, benchmarks/quality/RESOURCE-GATE.md), with no voice server on it: the STT and the TTS
# do not run (their drop-ins here), and the engine takes their memory and runs the scheduling that does the agents'
# work fastest.
#
# The KV pool, 8.4 GiB (9,019,431,321 bytes): the box's 5 GiB and the 3.4 GiB the speech servers hold on it, the STT
# about 2.4 GiB and the TTS about 1.0 GiB (docs/ARCHITECTURE.md, 3.1); 3,822 blocks of 16 tokens, 61,152 tokens at
# Qwen3-4B's 144 KiB a token, where the box's 5 GiB is 36,400. The engine, about 10.6 GiB with the box's pool, then
# takes about 14.0 GiB of the card's 15.9 (nvidia-smi's 16,311 MiB), 0.88 of it, under deploy/profile.py's R2 ceiling
# of 0.95 for one budget; its budget, 0.88, is what vLLM wants free at its start, which a card with the speech servers
# resident does not have, so the engine refuses to start beside them.
#
# The scheduling, vLLM's defaults for this card: first come, first served, a step cap of 2,048 tokens (the API
# server's default below 70 GiB of GPU memory) and no per-request prefill cap. On a card without calls nothing is
# protected from the agents' prefill, so the box's cap of 512 tokens a step (with 256 a request), which keeps a voice
# turn's steps short, only slows the agents: in E2's discriminating scenario, where their work bounds what they do,
# raising the cap to 1,024 with no threshold gave them 10% more (4,097 against 3,710 tokens a second, the medians of
# disc-a4-b1024-t0-s24's and disc-frozen-s24's five runs in benchmarks/results/2026-10-23-e2), and their requests are
# 99.5% prompt tokens, which a larger step prefills in fewer steps. Priority scheduling would order nothing: every
# request is the agents' class. The CPU tier (20 GiB) and prefix caching stay engine.yaml's. An arm changes any of it
# with engine flags, which come last.
[Service]
ExecStart=
ExecStart=%h/flatshare/src/deploy/bin/in-private-net %h/flatshare/venvs/engine/bin/vllm serve --config %h/flatshare/src/deploy/phastform/engine.yaml --kv-cache-memory 9019431321 --gpu-memory-utilization 0.88 --scheduling-policy fcfs --max-num-batched-tokens 2048 --long-prefill-token-threshold 0 --uds ${FLATSHARE_ENGINE_SOCKET} $FLATSHARE_ENGINE_FLAGS
