# Variant agents-only: the card serves the agents alone, so the STT does not run on it, and the engine has its memory
# (flatshare-engine.conf here). The condition never holds ("/" always exists), so neither flatshare.target nor a start
# of this unit starts it: systemd skips it, which is no failure. variant.sh keeps it stopped while the variant is
# linked and starts it again with the variant that follows (variant.sh use frozen restores the frozen box).
[Unit]
ConditionPathExists=!/
