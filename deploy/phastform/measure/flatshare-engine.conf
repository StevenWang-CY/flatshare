# The measurement drop-in: vLLM's development mode, for a box that is measured. flatshare-bench e2 run reads the
# engine's configuration from /server_info and empties its prefix cache with /reset_prefix_cache between points, and the
# drills read /server_info too; vLLM 0.32 serves them, with the rest of its development and RL routes (/collective_rpc,
# /sleep, /pause, /update_weights and the others that variants/README.md lists), only in this mode, which no production
# box runs. The engine serves them on its socket, in a directory only this user may enter. `deploy/phastform/variant.sh
# measure on|off` links it as flatshare-engine.service.d/measure.conf or removes it, and `variant.sh use` keeps it;
# benchmarks/e2/campaign.sh turns it on before each point.
[Service]
Environment=VLLM_SERVER_DEV_MODE=1
