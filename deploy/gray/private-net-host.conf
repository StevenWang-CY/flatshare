# Gray: the kernel refuses unprivileged user namespaces (Ubuntu 24.04's kernel.apparmor_restrict_unprivileged_userns=1,
# which only root lifts, and the deploying user has none), so deploy/bin/in-private-net cannot give this GPU server a
# network namespace of its own, and without this mark it would fail the unit rather than run without one.
# deploy/gray/install.sh links this drop-in into the engine's, the STT's and the TTS's units as private-net-host.conf
# when deploy/bin/private-net-check says the kernel refuses them, and removes it where they are allowed. The server then
# runs in the host's network namespace and serves only its Unix socket, in $XDG_RUNTIME_DIR/flatshare (mode 0700): its
# engine core's loopback listeners (torch's gloo groups, on ephemeral ports) and CUDA's abstract sockets are any local
# user's to reach there, and deploy/bin/audit-listeners accepts those and nothing else of its.
[Service]
Environment=FLATSHARE_PRIVATE_NET=host
