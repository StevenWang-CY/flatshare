# The box's serving configuration: the frozen box (rtx-5060-ti, every value of which it takes) running the change,
# make-room with the PRs' switches below, at the step cap the sweep chose, with no long-prefill threshold: the sweep's
# screens (benchmarks/results/2026-10-27-sweep, whose point of this configuration records every engine value below in
# its engine.json) and the confirmation rounds (benchmarks/results/2026-10-28-rounds). Its variant, make-room-serve,
# passes that step cap over engine.yaml's, which stays the frozen box's, the baseline every measurement changes.
# `profile.py render` writes the variant and serving.json, the effective configuration the box must run, beside the
# frozen box's files in deploy/phastform, and `profile.py check rtx-5060-ti-serve` keeps both current.
# deploy/bin/serving-check holds the running engine to serving.json at every start of the variant and at each release,
# and the voice worker's serve mode admits the calls it names.

[profile]
base = "rtx-5060-ti"
name = "rtx-5060-ti-serve"

[serving]
# The engine variant that runs it (deploy/templates/variants/make-room-serve).
variant = "make-room-serve"
# The vLLM release the scheduler module is written against: build.py refuses another.
vllm_version = "0.32.0"
# make-room's switches, keys of --additional-config's make_room table (deploy/phastform/variants/README.md).
max_preemptions_per_step = 2
budget_cap = true
budget_cap_tokens = 48
reserve_tokens = 0
# A call leaves free only the reservations of in-flight prefills of its own priority or a higher one: an agent's long
# prompt, loading from the CPU tier or prefilling in chunks, reserves the blocks it still needs (a thousand at 20,000
# tokens), and vLLM admits a load only beside every reservation, so without it a call's turn waited seconds behind the
# agents' loads. The budget cap holds the agents' prefill back in the step the call is admitted in. Measured in
# benchmarks/results/2026-11-01-engine-points.
take_reservations = true
# Lower-priority decodes sit out the steps of a call's first decode_hold_tokens output tokens, the budget cap's
# window, as their prefill already does: a step that also decodes an agent at 15,000 tokens of context takes 18-20 ms
# against 13 alone. The follow-up rounds (benchmarks/results/2026-11-02-opt-rounds) put 16 of 720 replies over the SLO
# beside 24 agent sessions against 55 without it, but cost the agents 3.8% of their token rate at the median, past the
# 3% the rounds' rule allowed: the profile takes it for the voice tail anyway (v1.17). 0 turns it off.
decode_hold_tokens = 48
# The calls' prefixes kept on the GPU between their turns, so that no turn reloads its own prefix from the CPU tier
# (a load costs a call two or three steps however small it is): up to retain_tokens tokens for both calls, each for
# retain_s seconds without a next turn. With max_model_len 32,768 on this pool, retain_tokens may be at most 3,632
# (227 blocks); 3,584 keeps both calls up to 1,792 tokens each.
retain_tokens = 3584
retain_s = 30
# Just-in-time scheduling of the next batch (python/flatshare_vllm/src/flatshare_vllm/serve/flatshare_jit.py): with a
# batch in flight, the engine core waits to schedule the next one until the one in flight is due to finish, by this
# card's step-time model, less jit_margin_ms, handling the requests that arrive meanwhile, so that a call arriving
# during an agent's long-context prefill step joins the next batch instead of waiting behind one committed before it
# arrived. The margin covers a schedule and a launch, a mixed step's piecewise launch on this host (25-26 ms)
# included, so a decode-only step is never waited on; 0 turns it off. The model is crates/flatshare-core/src/step.rs's
# StepCost::frozen_box, fitted on this card (a step's ms, µs a token, ns an attention pair, ns a token of context
# read, ms a mixed step adds). Measured in benchmarks/results/2026-11-01-engine-points.
# A call's turn announced before its request (python/flatshare_voice's hints.py): the voice worker sends a realtime
# request for one token when the user stops speaking, a speech recognition's round trip before the turn's request, and
# the budget cap holds lower-priority prefill back for hint_hold_ms from its arrival, so that the turn arrives into
# decode-only steps; 400 ms covers the recognition's round trip beside agents (its p95 under ~300 ms in the rounds).
# Measured in benchmarks/results/2026-11-01-engine-points. 0, and turn_hints false, turn it off.
hint_hold_ms = 400
turn_hints = true
jit_margin_ms = 30
jit_step_ms = 11.56
jit_us_per_token = 47.99
jit_ns_per_pair = 14.17
jit_ns_per_context = 429.3
jit_mixed_ms = 7.6
# The step cap the sweep chose for the change, with no long-prefill threshold (the records above): the variant passes
# both over engine.yaml's, and serving.json holds the engine to them.
max_num_batched_tokens = 256
long_prefill_token_threshold = 0
# The KV pool that kv_cache_memory's 5 GiB gives Qwen3-4B, 2,275 blocks of 16 tokens, and vLLM's own request slots and
# asynchronous scheduling on this card, which engine.yaml leaves to vLLM: as W5's engine.json records them [measured].
block_size = 16
pool_tokens = 36400
max_num_seqs = 256
async_scheduling = true
# The module build.py writes from make-room's patches on vLLM 0.32.0's scheduler, as python/flatshare_vllm's
# test_build.py builds it from v0.32.0's source. With retention off it schedules identically to the one Phastform's
# engine built on 2026-10-27 (0d24d178977f3c1b), which the records above measured (make test-trace with
# TRACE_REFERENCE set to that module finds every step the same); retention, which this profile turns on, is measured in
# benchmarks/results/2026-11-01-engine-points.
scheduler_module_sha256 = "7fda82b068c057a1ede8ce6ad09f5a25fafa6d7c0f5e21125dbddfce1a57cf12"
# The calls the voice worker takes at once in serve mode: two, the calls of E2's discriminating scenario, at which the
# sweep's screens and the confirmation rounds measured this configuration (the records above).
max_calls = 2
# The agents' sessions a node that carries the calls runs beside them at most: the card's envelope on this
# configuration in the rounds, 5 of 177 replies over the SLO beside 4 session trees and 31 beside 8
# (benchmarks/results/2026-10-28-rounds). The gateway's [[nodes]] hold a node to theirs (max_agents), and each release
# holds the running gateway to this one (deploy/bin/serving-check --nodes).
max_agents = 4
# The voice worker's audio configuration in serve mode: real callers' microphones, which the benchmark's synthetic
# callers do not measure (python/flatshare_voice/README.md).
audio = "microphone"
