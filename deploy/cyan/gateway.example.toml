# flatshare-gateway on cyan. Copy to ~/.config/flatshare/gateway.toml (mode 600), replace <home> with the deploy user's
# home directory and each other placeholder with the SHA-256 of a new key; the file holds digests only. To make a
# key and its digest:
#   key=$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n'); printf '%s' "$key" | sha256sum
# Every key is described in crates/flatshare-gateway/README.md.

# vLLM on Phastform, through its tunnel's socket (flatshare-tunnel@phastform; cyan's deploy user's uid, 1007, as below).
upstream = "unix:/run/user/1007/flatshare/phastform-engine.sock"
# The engine keeps idle connections for 60 s (VLLM_HTTP_TIMEOUT_KEEP_ALIVE in flatshare-engine.service), so voice turns
# seconds apart reuse a warm connection, which through the tunnel is an SSH session that is already open; let go of
# one 5 s before the engine would.
upstream_idle_timeout_s = 55
log_format = "json"
# How the class's priority reaches the upstream: X-Vllm-Priority (the default, for vLLM's priority scheduling),
# the body's `priority` (SGLang) or X-SMG-Priority (SMG). vLLM's FCFS scheduling ignores priorities; E2's arm 2
# sends none (the empty list).
# upstream_priority = ["vllm-header"]
# The secret each tenant's cache_salt is derived from, so that a tenant's name does not give its salt away: 32
# random bytes in hex, mode 600, which deploy/cyan/install.sh writes once.
cache_salt_secret_file = "<home>/.config/flatshare/cache-salt-secret"
# The key GET /metrics and /metrics/engine ask for on the TCP listener, which every user of cyan reaches: one line,
# mode 600, which deploy/cyan/install.sh writes once. Prometheus reads the same file (ops/prometheus); on the
# voice plane's socket, private to this user, no key is asked for.
metrics_key_file = "<home>/.config/flatshare/metrics-key"
# The choices a request may ask for: n (with use_beam_search, a beam's width) and best_of. vLLM runs each as a reply
# of its own, so the default is 1; a request that asks for more gets 400.
# max_choices = 1
# The work the gateway holds, with or without an admission policy: inference requests in flight (one more gets 503
# before its body is read; each tenant and class has its own bound too, below), the bytes of the bodies it holds, and
# the requests waiting at an admission policy's queues in all. E2's heaviest point held about 30 requests in flight.
# max_in_flight = 1024
# max_buffered_body_bytes = 268435456
# max_queued = 256

# The host network. Other users of cyan can reach loopback, so requests here need a key.
[[listen]]
tcp = "127.0.0.1:18080"

# The voice plane's way in. The socket file is private to this user, so its requests need no key. The path is
# the units' %t/flatshare/gateway.sock, with cyan's deploy user's uid (1007; `id -u` elsewhere).
[[listen]]
unix = "/run/user/1007/flatshare/gateway.sock"
tenant = "voice"

# The LiveKit voice worker. It sends X-Session-ID (voice-<room SID>) and X-Flatshare-Class: realtime.
[tenants.voice]
trusted = true
default_class = "realtime"
max_class = "realtime"

# Coding agents, through an API layer such as agentic-api.
[tenants.agents]
keys_sha256 = ["<sha256 of the agents key>"]
trusted = true
default_class = "background"
max_class = "interactive"
# Each tenant's requests in flight at most (512 by default); one more gets 429 before its body is read.
# max_in_flight = 512

# An untrusted client: its X-Session-ID and X-Flatshare-Class are ignored, and it gets background, so that it never
# outranks the agents (E2 replays its AIPerf traffic as the agents tenant).
[tenants.bench]
keys_sha256 = ["<sha256 of the bench key>"]
default_class = "background"

# What each class's requests may ask for. A capped body gets its route's own limit fields at the lower of the client's
# limit and the cap (crates/flatshare-gateway/README.md, Bounds), with or without an admission policy; no cap by
# default. Undegraded, E2's voice agent's replies ran 20 tokens at the median and 39 at most (W5's 5,571 replies: 52 at
# most), so a realtime cap of 64 cuts none of them.
# [classes.realtime]
# max_reply_tokens = 64
# max_in_flight = 128
# [classes.interactive]
# max_in_flight = 256
# [classes.background]
# max_reply_tokens = 8192
# max_in_flight = 512
# Each class's deadlines, with their defaults (realtime / interactive / background): the body's upload (60 s), a wait
# at the admission point (120 s), an attempt's response headers (first_byte_timeout_s, 600 s), the first content from
# the receipt (60 / 600 / 600 s), the wait for each frame after (30 / 600 / 600 s), and the whole request (300 / 1800 /
# 3600 s). E2's background first bytes ran to 232 s at p99 behind preemptions, its realtime ones to 13.4 s.
# upload_timeout_s = 60
# queue_timeout_s = 120
# headers_timeout_s = 600
# first_content_timeout_s = 600
# idle_timeout_s = 600
# total_timeout_s = 3600
# The service level's objective for a class's first content, from the receipt (crates/flatshare-gateway/README.md,
# Accounting): a valid request is good when it completes with its first content within it. Realtime's is the SLO's
# 250 ms (docs/SLO.md); a class without one is good when it completes.
# first_content_objective_s = 0.25

# The inference canary (crates/flatshare-gateway/README.md, The engine's state): vLLM's /health runs no inference, so
# the gateway finds the engine warming, serving, degraded or drained by its requests' successes and, only when none
# succeeded within interval_s, a one-token completion at the lowest priority, which /ready answers by: 200 only while
# serving. With their defaults; flatshare-bench e2 run switches it off for its points (enabled = false).
# [canary]
# enabled = true
# interval_s = 30
# timeout_s = 60
# degraded_after = 3

# Two GPU nodes instead of one upstream (crates/flatshare-gateway/README.md, Nodes): leave `upstream` above out, and
# give each node its engine and speech servers through cyan's tunnels. A node is healthy while its engine serves (its
# own canary) and its STT and TTS answer /health; a session stays on its node, a call takes one of its max_calls, a
# session whose node fails moves by its next request, and a node carrying calls moved from a failed one defers its
# agents until those calls end. The voice worker places a call with POST /v1/sessions, whose answer names the node's
# speech servers, and ends the placement with DELETE /v1/sessions/ID when the call ends, which frees its call slot at
# once. No [admission] table goes with [[nodes]]. For two mixed replicas that must each carry both calls when
# the other fails, each node's max_calls is 2 and the worker admits two calls in all. A node that carries calls holds
# its agents' sessions (interactive and background together) to max_agents, the serving profile's envelope: the most
# agents its card serves beside both calls within the voice SLO, as measured for the card, 4 for an RTX 5060 Ti on the
# serving profile. An agent's session that finds every node at its bound gets 503 no_agent_slot. A node with both roles
# must set max_agents, or max_agents = "unbounded" to run its agents without one (the gateway refuses to start
# otherwise); one with the background role alone has no bound unless it sets one. An agent's request that names no
# session takes no slot, so a node with a count takes it only while it holds no call. The blocks below are the serving
# arrangement on two cards (docs/PRODUCTION.md, Two cards): with calls = "fill" ([placement] below), phastform takes
# both calls and gray is a warm spare, which runs up to 12 agents' sessions and takes the calls only when phastform
# fails, its agents waiting while it carries any call.
# [[nodes]]
# name = "phastform"
# upstream = "unix:/run/user/1007/flatshare/phastform-engine.sock"
# roles = ["realtime", "background"]
# max_calls = 2
# max_agents = 4
# stt = "unix:/run/user/1007/flatshare/phastform-stt.sock"
# tts = "unix:/run/user/1007/flatshare/phastform-tts.sock"
#
# [[nodes]]
# name = "gray"
# upstream = "unix:/run/user/1007/flatshare/gray-engine.sock"
# roles = ["realtime", "background"]
# max_calls = 2
# max_agents = 12
# stt = "unix:/run/user/1007/flatshare/gray-stt.sock"
# tts = "unix:/run/user/1007/flatshare/gray-tts.sock"
#
# As the serving arrangement runs them. A session keeps its node 150 s without a request (300 by default): a client
# that never ends its sessions holds an ended one's agent slot until then, and 150 s is just above the agents' replay's
# 120 s cap on think times (benchmarks/results/2026-10-28-two-node-smoke). Each node is checked every second (a speech
# server's /health within 1 s), unhealthy after 3 failed checks in a row and healthy again after 2 passed ones; a node
# that carries calls moved to it covers, and runs none of its agents' requests until those calls end, whether or not
# the failed node is healthy again. A new or moved call goes to the first node in this file's order with a free call
# slot, so that gray takes calls only while phastform is full or not available, and gray covers while it carries any
# call, moved or new; phastform never covers for its own calls, its agents bounded by max_agents alone.
# [placement]
# idle_s = 150
# health_interval_s = 1
# health_timeout_s = 1
# unhealthy_after = 3
# healthy_after = 2
# failover_background_max_in_flight = 0
# calls = "fill"
#
# Calls spread instead, the default: a new or moved call goes to the node with the fewest calls, then the fewest
# requests in flight.
# calls = "spread"

# The admission policy (crates/flatshare-gateway/README.md#admission). Without the table, every request goes upstream
# at once. E2's baselines set one policy and its keys:
# [admission]
# policy = "static-cap"
# background_max_in_flight = 4
#
# policy = "token-reservation"
# reserved_tokens = 2048
# pool_tokens = 36400
#
# policy = "flow-control"
# ceilings = { realtime = 16, interactive = 12, background = 8 }
#
# policy = "preempt-resubmit"
#
# The lifecycle policy (policy = "lifecycle"), which E2's arm 9 runs with make-room. headroom_tokens is one voice
# turn at its longest, for each armed session: arm 1 averaged 646 prompt and 23 completion tokens a turn.
# policy = "lifecycle"
# headroom_tokens = 1024
# critical_prefill_budget_ms = 150
# degrade_max_tokens = 16
# and, with their defaults:
# trigger = "onset"
# max_num_batched_tokens = 512
# max_defer_s = 10
# state_timeout_s = 10
# An ablation switches one mechanism off and drops its keys: headroom = false (and trigger), throttle = false
# (and critical_prefill_budget_ms, max_num_batched_tokens), degrade = false (and degrade_max_tokens). With two off,
# the keys only they read go too: pool_tokens and headroom_tokens without the headroom and degrade, max_defer_s and
# queue_limit without the headroom and the throttle.
#
# Every policy's queues (lifecycle refuses no request for its wait, and takes no queue_timeout_s):
# queue_limit = 1024
# queue_timeout_s = 60
