# Variant serve: the voice worker's serving configuration, for real callers. Serve mode admits the calls the box's
# serving profile names (deploy/phastform/serving.json, rendered from deploy/profiles/rtx-5060-ti-serve.toml: two, with
# LiveKit's load threshold at 1 so that a full worker takes no job), and none while the gateway's /ready says the
# engine does not serve or while a release drains the worker; its audio is the profile's, real microphones (the
# end-of-turn model, LiveKit's AEC warm-up, a VAD that a noisy room trips less), which no benchmark measured. It
# writes its state to FLATSHARE_VOICE_STATUS every second (flatshare-voice-worker.service), which
# deploy/bin/serving-check holds to the profile. Link it in place of vad-turns, the experiments' fixed endpointing,
# which the microphone configuration refuses; flatshare-bench e2 run refuses a worker in serve mode (ops/RUNBOOK.md).
[Service]
Environment=FLATSHARE_VOICE_MODE=serve
Environment=FLATSHARE_SERVING_PROFILE=%h/flatshare/src/deploy/phastform/serving.json
