# Variant node-binding: the voice worker in bench mode asks the gateway for each call's GPU node, as serve mode does by
# default, and binds the call's STT and TTS to that node's tunnel sockets (python/flatshare_voice, nodes.py, and its
# README's contract), for points and drills on two GPU nodes behind the gateway's [[nodes]]. A gateway without nodes
# answers that it places nothing, and every call keeps the unit's sockets, as without the variant.
[Service]
Environment=FLATSHARE_NODE_BINDING=on
