# Variant e2-gateway: the gateway runs from the configuration flatshare-bench e2 run writes for a point,
# ~/.config/flatshare/gateway-e2.toml: gateway.toml with the arm file's [gateway] table merged in. flatshare-bench e2 run
# links this drop-in for an arm with a [gateway] table and removes it for one without; flatshare-bench e2 reset removes it.
[Service]
ExecStart=
ExecStart=%h/flatshare/bin/flatshare-gateway --config %h/.config/flatshare/gateway-e2.toml
