# Variant turn-hints: the voice worker announces each turn to the engine when the user stops speaking, a speech
# recognition's round trip before the turn's request (FLATSHARE_TURN_HINTS=true), so that an engine with
# make_room.hint_hold_ms holds agent prefill back for it. flatshare-bench e2 run links it for an arm with turn_hints =
# true; the serving profile turns it on in serve mode through its voice table. See hints.py.
[Service]
Environment=FLATSHARE_TURN_HINTS=true
