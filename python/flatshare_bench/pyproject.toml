[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flatshare-bench"
version = "1.8.0"
description = "Flatshare's benchmark toolchain: block-scaled agent traces, AIPerf plugins, latency probes, E2's harness and report, and the failure drills' client"
readme = "README.md"
# The figures' STIX Two fonts (src/flatshare_bench/fonts) are under the SIL Open Font License 1.1, the rest under
# Apache-2.0: the repository's LICENSE, copied here, as a wheel built from the sdist cannot reach the root.
license = "Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "src/flatshare_bench/fonts/OFL.txt"]
authors = [{ name = "Chuyue Wang" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    # Installed from this repository, never uploaded to PyPI.
    "Private :: Do Not Upload",
]
dependencies = [
    "aiohttp>=3.14,<4",
    "httpx>=0.28,<0.29",
    "orjson>=3.11,<4",
    "fonttools==4.67.0",  # the figures' embedded font subsets: the committed bytes
    "flatshare-stats",  # python/flatshare_stats, from this tree (tool.uv.sources)
]

[project.urls]
Homepage = "https://github.com/StevenWang-CY/flatshare"
Repository = "https://github.com/StevenWang-CY/flatshare"
Documentation = "https://github.com/StevenWang-CY/flatshare/blob/main/python/flatshare_bench/README.md"
Issues = "https://github.com/StevenWang-CY/flatshare/issues"

[project.optional-dependencies]
# AIPerf runs a point's agents (flatshare-bench e2 run) and loads the plugins; a report needs none of its
# packages.
aiperf = ["aiperf==0.13.0"]
# resvg renders the repository's social preview (python -m flatshare_bench.brand, make brand).
brand = ["resvg-py==0.5.0"]
# matplotlib (with numpy and Pillow): the demo video's frames, which tests/test_demo.py draws with demo.py; the
# script itself brings its own (benchmarks/e2/demo.py), and nothing in the package imports them.
test = ["pytest>=8,<10", "flatshare-bench[aiperf]", "matplotlib==3.11.2"]

[project.scripts]
flatshare-bench = "flatshare_bench.cli:main"

[project.entry-points."aiperf.plugins"]
flatshare = "flatshare_bench:plugins.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "integration: needs more than this venv (the demo video's encoding runs the script with uv)",
]

[tool.uv.sources]
flatshare-stats = { path = "../flatshare_stats", editable = true }
