schema_version: "1.0"

endpoint:
  flatshare_chat:
    class: flatshare_bench.aiperf_plugin:FlatshareChatEndpoint
    description: |
      OpenAI chat completions plus Flatshare's per-session metadata: the X-Session-ID
      header (the session-tree root, shared by a parent and its subagents), the X-Flatshare-Class
      header, and the prompt_cache_key and vLLM priority body fields.
      Configured by FLATSHARE_BENCH_CLASS and FLATSHARE_BENCH_SEND_PRIORITY.
    metadata:
      endpoint_path: /v1/chat/completions
      supports_streaming: true
      produces_tokens: true
      tokenizes_input: true
      consumes_system_message: true
      supports_cache_bust: true
      metrics_title: LLM Metrics

custom_dataset_loader:
  weka_trace_scaled:
    class: flatshare_bench.aiperf_plugin:WekaTraceScaledLoader
    description: |
      weka_trace that honours each trace file's own block_size, for traces scaled by
      `flatshare-bench scale-traces`. The stock entry forces 64 tokens per block.
      Usage: --custom-dataset-type weka_trace_scaled --input-file DIR
    metadata:
      is_trace: true
      default_prompt_corpus: coding
