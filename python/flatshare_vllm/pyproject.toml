[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flatshare-vllm"
version = "1.2.0"
description = "Flatshare's patches to vLLM 0.32's scheduler: the make-room variant (vLLM PRs #63350 and #63351, backported) and the pr54530 baseline, their build, GPU probes and tests"
readme = "README.md"
license = "Apache-2.0"
# The repository's LICENSE, copied here: a wheel built from the sdist cannot reach the root.
license-files = ["LICENSE"]
authors = [{ name = "Chuyue Wang" }]
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # Installed from this repository, never uploaded to PyPI.
    "Private :: Do Not Upload",
]
# vLLM itself comes from the engine environment (deploy/phastform/requirements/engine.txt).
dependencies = []

[project.urls]
Homepage = "https://github.com/StevenWang-CY/flatshare"
Repository = "https://github.com/StevenWang-CY/flatshare"
Documentation = "https://github.com/StevenWang-CY/flatshare/blob/main/python/flatshare_vllm/README.md"
Issues = "https://github.com/StevenWang-CY/flatshare/issues"

[project.optional-dependencies]
# aiohttp: probe.py's and tail.py's tests, against a stand-in engine; the engine environment has it too.
test = ["pytest>=8,<10", "aiohttp>=3.14,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
